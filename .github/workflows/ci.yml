# Rama main: harness. No corre en landing (el Astro lleva su propio workflow).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun test

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Isolated pi agent dir
        shell: bash
        run: echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"
      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      - name: Install this checkout
        shell: bash
        run: pi install .
      - name: Headless doctor
        shell: bash
        run: |
          # Print mode still loads the extension without a provider.
          pi --alfred-pi=doctor --no-session -p "ok" > out-doctor.txt 2>&1 || true
          cat out-doctor.txt
          grep -q "Alfred-Pi doctor" out-doctor.txt
          grep -q "config:" out-doctor.txt
      - name: Slash command
        shell: bash
        run: |
          pi --no-session -p "/providers:doctor" > out-cmd.txt 2>&1 || true
          cat out-cmd.txt
          grep -q "Alfred-Pi doctor" out-cmd.txt
      - name: Headless usage
        shell: bash
        run: |
          pi --alfred-pi=usage --no-session -p "ok" > out-usage.txt 2>&1 || true
          cat out-usage.txt
          grep -q "Alfred-Pi usage" out-usage.txt
